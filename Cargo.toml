[package]
name = "audiostrike"
version = "0.1.0"
edition = "2024"
description = "Local multitrack audio editor"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
eframe = { version = "=0.30.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
rfd = { version = "=0.15.4", optional = true }
cpal = { version = "=0.15.3", optional = true }
png = { version = "=0.18.1", optional = true }

[features]
desktop = ["dep:eframe", "dep:rfd", "dep:cpal", "dep:png"]

[[bin]]
name = "audiostrike-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

